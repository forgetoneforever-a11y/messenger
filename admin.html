<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoVnilka — Админ Панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: #0d0f18;
            color: #f3f4f6;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #a855f7; margin-bottom: 20px; font-size: 24px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-btn {
            background: #a855f7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }
        th { color: #9ca3af; font-weight: 600; }
        td { color: #f3f4f6; }
        .empty { text-align: center; color: #6b7280; padding: 20px; }
        .password-badge {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            color: #d8b4fe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>База аккаунтов ZoVnilka</span>
            <button class="refresh-btn" onclick="loadUsers()">Обновить</button>
        </h1>
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Никнейм</th>
                    <th>Пароль</th>
                    <th>Дата регистрации</th>
                    <th>IP адрес</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <tr><td colspan="5" class="empty">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Загрузка...</td></tr>';
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty">Пока нет зарегистрированных пользователей</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                users.forEach((user, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td style="color: #a855f7; font-weight: 600;">${user.username}</td>
                        <td><span class="password-badge">${user.password}</span></td>
                        <td>${user.regDate}</td>
                        <td style="color: #9ca3af;">${user.ip || 'Неизвестно'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">Ошибка загрузки данных</td></tr>';
            }
        }

        loadUsers();
    </script>
</body>
</html>
