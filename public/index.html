<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мессенджер</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f1117; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #161922; border-right: 1px solid #222634; display: flex; flex-direction: column; padding: 15px; }
        .main-chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 15px 20px; background: #161922; border-bottom: 1px solid #222634; font-weight: bold; font-size: 16px; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #222634; padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; }
        .message.private { background: #3b2a50; border: 1px solid #7c3aed; }
        .input-box { padding: 15px 20px; background: #161922; display: flex; gap: 10px; border-top: 1px solid #222634; }
        input, button { padding: 10px 14px; border-radius: 6px; border: none; outline: none; font-size: 14px; }
        input { background: #222634; color: #fff; flex: 1; }
        button { background: #7c3aed; color: #fff; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #6d28d9; }
        .user-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; background: #1e2230; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .user-item:hover { background: #2b3044; }
        .user-item.active { background: #7c3aed33; border: 1px solid #7c3aed; }
        #login-screen { position: fixed; inset: 0; background: #0f1117; display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; gap: 15px; }
        #login-screen input { width: 300px; max-width: 90%; text-align: center; font-size: 16px; }
        .time { font-size: 10px; color: #9ca3af; margin-left: 8px; }
    </style>
</head>
<body>

    <!-- Экран ввода имени -->
    <div id="login-screen">
        <h2>Введите ваш юзернейм</h2>
        <input type="text" id="usernameInput" placeholder="Например, Ярослав..." autofocus>
        <button id="loginBtn">Войти в чат</button>
    </div>

    <!-- Боковая панель с онлайн пользователями -->
    <div class="sidebar">
        <h3>Участники онлайн (<span id="userCount">0</span>)</h3>
        <button id="globalChatBtn" style="margin-bottom: 15px; background: #222634; width: 100%;">🌐 Общий чат</button>
        <div id="usersList" style="flex:1; overflow-y: auto;"></div>
    </div>

    <!-- Основная область чата -->
    <div class="main-chat">
        <div class="chat-header" id="chatTitle">Общий чат</div>
        <div class="messages" id="messagesContainer"></div>
        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Введите сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>

    <!-- Подключаем Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let myUsername = '';
        let currentTargetId = 'global'; // 'global' или socket.id конкретного юзера
        // Хранилище истории сообщений: { 'global': [...], 'socket_id': [...] }
        const chatHistories = { global: [] };

        const loginScreen = document.getElementById('login-screen');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        
        const usersList = document.getElementById('usersList');
        const userCount = document.getElementById('userCount');
        const chatTitle = document.getElementById('chatTitle');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const globalChatBtn = document.getElementById('globalChatBtn');

        // Вход в чат
        function handleLogin() {
            const name = usernameInput.value.trim();
            if (!name) return alert('Введите имя!');
            myUsername = name;
            socket.emit('set_username', myUsername);
            loginScreen.style.display = 'none';
        }

        loginBtn.onclick = handleLogin;
        usernameInput.onkeypress = (e) => { if (e.key === 'Enter') handleLogin(); };

        // Переключение на общий чат
        globalChatBtn.onclick = () => {
            currentTargetId = 'global';
            chatTitle.innerText = 'Общий чат';
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            globalChatBtn.style.background = '#7c3aed';
            renderMessages();
        };

        // Отправка сообщения
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            if (currentTargetId === 'global') {
                socket.emit('chat_message', { message: text });
            } else {
                socket.emit('private_message', { to: currentTargetId, message: text });
            }
            messageInput.value = '';
        }

        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

        // Получение общего сообщения
        socket.on('chat_message', (data) => {
            if (!chatHistories['global']) chatHistories['global'] = [];
            chatHistories['global'].push({
                text: `<b>${data.sender}</b>: ${data.message} <span class="time">${data.time}</span>`,
                isPrivate: false
            });
            if (currentTargetId === 'global') renderMessages();
        });

        // Получение личного сообщения от кого-то
        socket.on('private_message', (data) => {
            const peerId = data.senderId;
            if (!chatHistories[peerId]) chatHistories[peerId] = [];
            
            chatHistories[peerId].push({
                text: `<b>[ЛС] ${data.senderName}</b>: ${data.message} <span class="time">${data.time}</span>`,
                isPrivate: true
            });
            
            if (currentTargetId === peerId) renderMessages();
        });

        // Подтверждение отправки своего личного сообщения
        socket.on('private_message_sent', (data) => {
            const peerId = data.to;
            if (!chatHistories[peerId]) chatHistories[peerId] = [];

            chatHistories[peerId].push({
                text: `<b>[Вы -> ЛС]</b>: ${data.message} <span class="time">${data.time}</span>`,
                isPrivate: true
            });

            if (currentTargetId === peerId) renderMessages();
        });

        // Обновление списка онлайн пользователей
        socket.on('update_users', (users) => {
            usersList.innerHTML = '';
            userCount.innerText = users.length;

            users.forEach(user => {
                if (user.id === socket.id) return; // Себя не выводим в список для ЛС
                
                const div = document.createElement('div');
                div.className = 'user-item' + (currentTargetId === user.id ? ' active' : '');
                div.innerHTML = `<span>${user.username}</span> <span style="font-size:11px; color:#10b981;">●</span>`;
                
                div.onclick = () => {
                    currentTargetId = user.id;
                    chatTitle.innerText = `ЛС с ${user.username}`;
                    globalChatBtn.style.background = '#222634';
                    
                    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    
                    renderMessages();
                };
                usersList.appendChild(div);
            });
        });

        // Отрисовка сообщений текущего активного чата
        function renderMessages() {
            messagesContainer.innerHTML = '';
            const history = chatHistories[currentTargetId] || [];
            
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'message' + (item.isPrivate ? ' private' : '');
                div.innerHTML = item.text;
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
