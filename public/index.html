<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoVnilka — Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: #090a0f;
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, #090a0f 80%);
        }
        .container {
            width: 100%;
            max-width: 1250px;
            height: 94vh;
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        #auth-screen {
            margin: auto;
            text-align: center;
            padding: 40px;
            background: rgba(20, 24, 40, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        #auth-screen h1 { margin-bottom: 20px; font-size: 26px; color: #c084fc; text-shadow: 0 0 15px rgba(168,85,247,0.4); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #9ca3af; }
        
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(10, 13, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .input-group input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.3); }
        
        .toggle-password {
            position: absolute; right: 12px; background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 16px;
        }
        .toggle-password:hover { color: #a855f7; }

        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 5px;
            box-shadow: 0 4px 15px rgba(168,85,247,0.4);
        }
        .btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(168,85,247,0.6); }
        .toggle-auth { margin-top: 15px; font-size: 13px; color: #9ca3af; cursor: pointer; }
        .toggle-auth span { color: #a855f7; font-weight: 600; }
        .error-msg { color: #f87171; font-size: 12px; margin-bottom: 10px; display: none; }

        #chat-screen {
            display: none; width: 100%; height: 100%; flex-direction: row;
        }

        .nav-rail {
            width: 76px; background: rgba(10, 12, 20, 0.6); border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 16px; z-index: 5;
        }
        .nav-item {
            width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            color: #9ca3af; font-size: 18px; cursor: pointer; transition: all 0.25s ease; position: relative;
        }
        .nav-item:hover { background: rgba(168, 85, 247, 0.15); color: #c084fc; transform: scale(1.05); }
        .nav-item.active { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .nav-item.logout { margin-top: auto; color: #f87171; }
        .nav-item.logout:hover { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .sidebar-panels {
            width: 320px; background: rgba(12, 15, 25, 0.45); border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column;
        }
        .panel-content { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px; }
        .panel-content.active { display: flex; }

        .panel-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 15px; }

        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input {
            width: 100%; padding: 10px 14px 10px 38px; background: rgba(10, 13, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #fff; font-size: 13px; outline: none;
        }
        .search-box input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.25); }
        .search-box i { position: absolute; left: 13px; top: 12px; color: #9ca3af; font-size: 14px; }

        .chat-item {
            display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
            background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.15); cursor: pointer;
            transition: all 0.2s; margin-bottom: 8px;
        }
        .chat-item:hover { background: rgba(168, 85, 247, 0.18); }
        .chat-item.active-chat { border-color: #a855f7; background: rgba(168, 85, 247, 0.25); }
        
        .chat-item-avatar {
            width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #3b82f6);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; overflow: hidden; flex-shrink: 0;
        }
        .chat-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-item-info .title { font-size: 14px; font-weight: 600; color: #fff; }
        .chat-item-info .preview { font-size: 12px; color: #9ca3af; margin-top: 2px; }

        .profile-card { text-align: center; }
        .profile-big-ava {
            width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: bold; color: #fff; box-shadow: 0 8px 25px rgba(168,85,247,0.3); border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden; position: relative; cursor: pointer; background: linear-gradient(135deg, #a855f7, #6366f1);
        }
        .profile-big-ava img { width: 100%; height: 100%; object-fit: cover; }
        .profile-field { text-align: left; margin-bottom: 14px; }
        .profile-field label { font-size: 12px; color: #9ca3af; display: block; margin-bottom: 6px; }
        .profile-field input { width: 100%; padding: 11px 14px; background: rgba(10, 13, 20, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 13px; outline: none; }

        .tg-chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(10, 13, 20, 0.25); position: relative; }
        .tg-chat-header {
            padding: 14px 24px; background: rgba(15, 18, 30, 0.4); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; gap: 14px; backdrop-filter: blur(10px);
        }
        .tg-chat-header .chat-title { font-size: 15px; font-weight: 600; color: #fff; }
        .tg-chat-header .chat-status { font-size: 12px; color: #10b981; }

        .tg-messages {
            flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 0); background-size: 24px 24px;
        }
        
        .message {
            max-width: 68%; padding: 10px 14px 8px 14px; border-radius: 16px; background: rgba(30, 36, 56, 0.85);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); position: relative; word-break: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 4px; align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .message.my-message {
            background: linear-gradient(135deg, #8b5cf6, #6366f1); align-self: flex-end; border-bottom-right-radius: 4px;
            border-bottom-left-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        .msg-user { font-size: 12px; color: #c084fc; font-weight: 600; margin-bottom: 2px; }
        .msg-content { font-size: 14px; color: #f3f4f6; line-height: 1.45; padding-right: 65px; }
        .message.my-message .msg-content { color: #ffffff; }
        .msg-image { max-width: 100%; max-height: 260px; border-radius: 10px; margin-top: 6px; cursor: pointer; display: block; }
        
        .msg-footer-row { position: absolute; bottom: 6px; right: 10px; display: flex; align-items: center; gap: 4px; }
        .msg-time { font-size: 10px; color: rgba(255, 255, 255, 0.6); }
        .msg-ticks { font-size: 11px; color: rgba(255, 255, 255, 0.6); letter-spacing: -2px; }
        .msg-ticks.read { color: #38bdf8; }

        .tg-input-area {
            padding: 16px 24px; background: rgba(15, 18, 30, 0.5); border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; gap: 12px; align-items: center; backdrop-filter: blur(10px);
        }
        .file-btn { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; }
        .file-btn:hover { color: #a855f7; }
        
        .tg-input-area input {
            flex: 1; padding: 12px 18px; background: rgba(10, 13, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; color: #fff; outline: none; font-size: 14px;
        }
        .tg-input-area input:focus { border-color: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.25); }
        .send-btn {
            width: 44px; height: 44px; background: linear-gradient(135deg, #a855f7, #6366f1); border: none; border-radius: 50%;
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(168,85,247,0.4);
        }
        .send-btn:hover { transform: scale(1.08); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран Входа -->
        <div id="auth-screen">
            <h1 id="auth-title">Вход в ZoVnilka</h1>
            <div class="error-msg" id="error-msg">Ошибка</div>
            <div class="input-group">
                <label>Юзернейм (@username):</label>
                <input type="text" id="username-input" placeholder="@nickname">
            </div>
            <div class="input-group">
                <label>Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="password-input" placeholder="Пароль...">
                    <button type="button" class="toggle-password" id="toggle-password-btn"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
                </div>
            </div>
            <button class="btn" id="auth-btn">Войти</button>
            <div class="toggle-auth" id="toggle-auth-btn">Нет аккаунта? <span>Зарегистрироваться</span></div>
        </div>

        <!-- Экран Чата -->
        <div id="chat-screen">
            <div class="nav-rail">
                <div class="nav-item active" onclick="switchTab('chats', this)" title="Чаты"><i class="fa-solid fa-comments"></i></div>
                <div class="nav-item" onclick="switchTab('profile', this)" title="Профиль"><i class="fa-solid fa-user"></i></div>
                <div class="nav-item" onclick="switchTab('settings', this)" title="Настройки"><i class="fa-solid fa-gear"></i></div>
                <div class="nav-item logout" onclick="logout()" title="Выйти"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
            </div>

            <div class="sidebar-panels">
                <div class="panel-content active" id="panel-chats">
                    <div class="panel-title">Чаты</div>
                    <div class="chat-item active-chat" id="chat-item-global" onclick="openGlobalChat()">
                        <div class="chat-item-avatar"><i class="fa-solid fa-bullhorn"></i></div>
                        <div class="chat-item-info">
                            <div class="title">Общий чат</div>
                            <div class="preview">Публичный канал</div>
                        </div>
                    </div>

                    <div class="search-box" style="margin-top: 15px;">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="search-user-input" placeholder="Поиск @username...">
                    </div>

                    <div class="search-results-list" id="search-results-container"></div>
                </div>

                <div class="panel-content" id="panel-profile">
                    <div class="panel-title">Мой профиль</div>
                    <div class="profile-card">
                        <div class="profile-big-ava" onclick="document.getElementById('avatar-file-input').click()">
                            <span id="profile-ava-letter">U</span>
                            <img id="profile-img-preview" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
                        </div>
                        <div class="profile-field">
                            <label>Юзернейм</label>
                            <input type="text" id="profile-username" readonly style="opacity: 0.7;">
                        </div>
                        <button class="btn" onclick="saveProfile()">Сохранить аватарку</button>
                    </div>
                </div>

                <div class="panel-content" id="panel-settings">
                    <div class="panel-title">Настройки</div>
                    <div class="setting-item" style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <span>Звуки уведомлений</span>
                        <input type="checkbox" checked>
                    </div>
                </div>
            </div>

            <div class="tg-chat-area">
                <div class="tg-chat-header">
                    <div class="user-avatar" id="current-chat-icon" style="width: 36px; height: 36px; background: #6366f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow:hidden;"><i class="fa-solid fa-bullhorn"></i></div>
                    <div>
                        <div class="chat-title" id="current-chat-title">Общий чат ZoVnilka</div>
                        <div class="chat-status" id="chat-header-status">Публичный канал</div>
                    </div>
                </div>

                <div class="tg-messages" id="messages-container"></div>

                <div class="tg-input-area">
                    <label class="file-btn" title="Прикрепить картинку">
                        <i class="fa-solid fa-paperclip"></i>
                        <input type="file" id="media-file-input" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="message-input" placeholder="Написать сообщение...">
                    <button class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let isRegistering = false;
        let socket;
        let username = localStorage.getItem('zov_username') || '';
        let userAvatar = localStorage.getItem('zov_avatar') || ''; 
        let currentTargetUser = null; 
        
        // Загрузка сохраненных чатов и списка диалогов из localStorage
        let chatHistories = JSON.parse(localStorage.getItem('zov_chat_histories')) || { 'global': [] };
        let activePMUsers = new Set(JSON.parse(localStorage.getItem('zov_active_pm_users')) || []);

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('error-msg');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const searchUserInput = document.getElementById('search-user-input');
        const searchResultsContainer = document.getElementById('search-results-container');

        function saveChatHistories() {
            localStorage.setItem('zov_chat_histories', JSON.stringify(chatHistories));
            localStorage.setItem('zov_active_pm_users', JSON.stringify(Array.from(activePMUsers)));
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (username) {
                initSession(username);
            }
        });

        function formatUsername(val) {
            val = val.trim();
            if (!val.startsWith('@')) {
                return '@' + val;
            }
            return val;
        }

        function initSession(u) {
            username = u;
            localStorage.setItem('zov_username', username);
            socket = io();

            socket.on('connect', () => {
                socket.emit('set_user_data', { username, avatar: '' });
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                document.getElementById('profile-username').value = username;
                updateProfileAvaUI();
                renderChatList();
            });

            socket.on('chat_message', (data) => {
                chatHistories['global'].push(data);
                saveChatHistories();
                if (currentTargetUser === null) {
                    appendMessageDOM(data);
                }
            });

            socket.on('private_message', (data) => {
                const chatPartner = data.sender === username ? data.recipient : data.sender;
                if (!chatHistories[chatPartner]) chatHistories[chatPartner] = [];
                chatHistories[chatPartner].push(data);
                activePMUsers.add(chatPartner);
                saveChatHistories();

                if (currentTargetUser === chatPartner) {
                    appendMessageDOM(data);
                    socket.emit('mark_read', { sender: chatPartner });
                }
                renderChatList();
            });

            socket.on('messages_read', (data) => {
                if (chatHistories[data.by]) {
                    chatHistories[data.by].forEach(msg => {
                        if (msg.sender === username) msg.read = true;
                    });
                    saveChatHistories();
                }
                renderCurrentChatMessages();
            });
        }

        document.getElementById('auth-btn').addEventListener('click', () => {
            let u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) { errorMsg.innerText = 'Заполни все поля!'; errorMsg.style.display = 'block'; return; }
            u = formatUsername(u);
            initSession(u);
        });

        function switchTab(tabName, element) {
            document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`panel-${tabName}`).classList.add('active');
            element.classList.add('active');
        }

        function logout() {
            localStorage.removeItem('zov_username');
            window.location.reload();
        }

        function openGlobalChat() {
            currentTargetUser = null;
            document.getElementById('current-chat-title').innerText = 'Общий чат ZoVnilka';
            document.getElementById('chat-header-status').innerText = 'Публичный канал';
            document.getElementById('current-chat-icon').innerHTML = '<i class="fa-solid fa-bullhorn"></i>';
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active-chat'));
            document.getElementById('chat-item-global').classList.add('active-chat');
            renderCurrentChatMessages();
        }

        function openPrivateChat(targetUsername) {
            if (targetUsername === username) return;
            currentTargetUser = targetUsername;
            activePMUsers.add(targetUsername);
            
            if (!chatHistories[targetUsername]) chatHistories[targetUsername] = [];

            document.getElementById('current-chat-title').innerText = targetUsername;
            document.getElementById('chat-header-status').innerText = 'Личное сообщение';
            document.getElementById('current-chat-icon').innerHTML = targetUsername.replace('@', '').charAt(0).toUpperCase();

            socket.emit('mark_read', { sender: targetUsername });
            
            chatHistories[targetUsername].forEach(m => { if(m.sender === username) m.read = true; });
            saveChatHistories();

            renderChatList();
            renderCurrentChatMessages();
        }

        searchUserInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                socket.emit('search_users', query, (foundUsers) => {
                    renderChatList(foundUsers);
                });
            } else {
                renderChatList();
            }
        });

        function renderChatList(usersToDisplay = []) {
            searchResultsContainer.innerHTML = '';
            const displayList = usersToDisplay.length > 0 ? usersToDisplay : Array.from(activePMUsers);

            displayList.forEach(usrName => {
                const targetName = typeof usrName === 'string' ? usrName : usrName.username;
                if (targetName === username) return;

                const row = document.createElement('div');
                row.className = `chat-item ${currentTargetUser === targetName ? 'active-chat' : ''}`;
                row.onclick = () => openPrivateChat(targetName);
                
                row.innerHTML = `
                    <div class="chat-item-avatar">${targetName.replace('@','').charAt(0).toUpperCase()}</div>
                    <div class="chat-item-info">
                        <div class="title">${targetName}</div>
                        <div class="preview">Личный чат</div>
                    </div>
                `;
                searchResultsContainer.appendChild(row);
            });
        }

        function renderCurrentChatMessages() {
            messagesContainer.innerHTML = '';
            const history = chatHistories[currentTargetUser === null ? 'global' : currentTargetUser] || [];
            history.forEach(data => appendMessageDOM(data));
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendMessageDOM(data) {
            const div = document.createElement('div');
            const isMy = data.sender === username;
            div.className = `message ${isMy ? 'my-message' : ''}`;
            
            let contentHtml = `<div class="msg-content">${data.message}</div>`;
            if (data.image) {
                contentHtml += `<img src="${data.image}" class="msg-image" onclick="window.open(this.src)">`;
            }

            let ticksHtml = '';
            if (isMy && currentTargetUser !== null) {
                const readClass = data.read ? 'read' : '';
                ticksHtml = `<span class="msg-ticks ${readClass}">✓✓</span>`;
            }

            div.innerHTML = `
                ${!isMy ? `<div class="msg-user">${data.sender}</div>` : ''}
                ${contentHtml}
                <div class="msg-footer-row">
                    ${ticksHtml}
                    <span class="msg-time">${data.time}</span>
                </div>
            `;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (currentTargetUser === null) {
                socket.emit('chat_message', { message: text });
            } else {
                socket.emit('private_message', { recipient: currentTargetUser, message: text });
                const pmData = { sender: username, recipient: currentTargetUser, message: text, time: time, read: false };
                chatHistories[currentTargetUser].push(pmData);
                saveChatHistories();
                appendMessageDOM(pmData);
            }
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        const avatarFileInput = document.getElementById('avatar-file-input');
        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userAvatar = event.target.result;
                    localStorage.setItem('zov_avatar', userAvatar);
                    updateProfileAvaUI();
                };
                reader.readAsDataURL(file);
            }
        });

        function updateProfileAvaUI() {
            const letterSpan = document.getElementById('profile-ava-letter');
            const imgPreview = document.getElementById('profile-img-preview');
            if (userAvatar) {
                imgPreview.src = userAvatar;
                imgPreview.style.display = 'block';
                letterSpan.style.display = 'none';
            } else {
                imgPreview.style.display = 'none';
                letterSpan.style.display = 'block';
                letterSpan.innerText = username ? username.replace('@','').charAt(0).toUpperCase() : 'U';
            }
        }

        function saveProfile() {
            alert('Аватарка успешно сохранена локально!');
        }
    </script>
</body>
</html>
