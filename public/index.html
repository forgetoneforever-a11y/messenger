<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; background: #0f0f13; color: #fff; }
        body, html { height: 100%; overflow: hidden; }
        .hidden { display: none !important; }

        /* Окно авторизации */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-box { background: #181820; padding: 30px; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .auth-box input, .auth-box button { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; }
        .auth-box button { background: #6c5ce7; border: none; cursor: pointer; font-weight: bold; }

        /* Основной интерфейс */
        #app-screen { display: flex; height: 100vh; }
        .sidebar-nav { width: 80px; background: #14141a; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; border-right: 1px solid #222; }
        .nav-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 10px; border-radius: 8px; }
        .nav-btn.active { background: #222230; color: #6c5ce7; }

        .content-area { flex: 1; display: flex; position: relative; }
        .tab-content { width: 100%; height: 100%; display: flex; }
        .tab-content.hidden { display: none; }

        /* Интерфейс чатов в стиле Telegram */
        .chats-sidebar { width: 300px; background: #131318; border-right: 1px solid #222; display: flex; flex-direction: column; padding: 15px; gap: 10px; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0f0f13; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { padding: 15px; background: #14141a; display: flex; gap: 10px; border-top: 1px solid #222; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1d1d26; color: #fff; outline: none; }
        .chat-input-area button { padding: 0 20px; background: #6c5ce7; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; }

        .message { max-width: 60%; padding: 10px 14px; border-radius: 10px; background: #222230; word-break: break-word; }
        .message.my { background: #6c5ce7; align-self: flex-end; }

        /* Профиль */
        .profile-wrapper { padding: 30px; width: 100%; overflow-y: auto; }
        .profile-container { max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #333; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group input { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #181820; color: #fff; }
        .save-btn { padding: 10px; background: #6c5ce7; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>Вход</h2>
            <input type="text" id="authUsername" placeholder="Введите юзернейм (@username)">
            <button id="authBtn">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="app-screen" class="hidden">
        <div class="sidebar-nav">
            <button class="nav-btn active" onclick="switchTab('chat', this)">💬</button>
            <button class="nav-btn" onclick="switchTab('profile', this)">👤</button>
        </div>

        <div class="content-area">
            <!-- Вкладка чатов -->
            <div id="tab-chat" class="tab-content">
                <div class="chats-sidebar">
                    <h3>Чаты</h3>
                    <div style="color: #888; font-size: 14px; margin-top: 10px;">Общий чат</div>
                </div>
                <div class="chat-main">
                    <div style="padding: 15px 20px; background: #131318; border-bottom: 1px solid #222; font-weight: bold;">Общий чат</div>
                    <div class="chat-messages" id="messagesContainer"></div>
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" placeholder="Написать сообщение...">
                        <button id="sendBtn">Отправить</button>
                    </div>
                </div>
            </div>

            <!-- Вкладка профиля -->
            <div id="tab-profile" class="tab-content hidden">
                <div class="profile-wrapper">
                    <h2>Мой профиль</h2>
                    <div class="profile-container" style="margin-top: 20px;">
                        <img id="profileAvatarImg" class="avatar-preview" src="" alt="Аватар">
                        <input type="file" id="avatarFileInput" accept="image/*">
                        
                        <div class="input-group">
                            <label>Отображаемое имя (Ник)</label>
                            <input type="text" id="displayNameInput" placeholder="Ваше имя">
                        </div>

                        <div class="input-group">
                            <label>Юзернейм</label>
                            <input type="text" id="usernameInput" placeholder="@username">
                        </div>

                        <button class="save-btn" id="saveProfileBtn">Сохранить на сервер</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const savedUser = JSON.parse(localStorage.getItem('user') || 'null');
        if (savedUser) {
            initApp(savedUser);
        }

        document.getElementById('authBtn').addEventListener('click', async () => {
            const username = document.getElementById('authUsername').value.trim();
            if (!username) return alert('Введите юзернейм!');

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const user = await res.json();

            localStorage.setItem('user', JSON.stringify(user));
            initApp(user);
        });

        function initApp(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            document.getElementById('usernameInput').value = user.username || '';
            document.getElementById('displayNameInput').value = user.displayName || '';
            if (user.avatar) {
                document.getElementById('profileAvatarImg').src = user.avatar;
            }
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(item => item.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(item => item.classList.remove('active'));

            if (tabName === 'chat') {
                document.getElementById('tab-chat').classList.remove('hidden');
            } else if (tabName === 'profile') {
                document.getElementById('tab-profile').classList.remove('hidden');
            }
            el.classList.add('active');
        }

        // Отправка и получение сообщений через Socket.IO
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');

        function sendMessage() {
            const text = messageInput.value.trim();
            const user = JSON.parse(localStorage.getItem('user'));
            if (!text || !user) return;

            socket.emit('chat message', { user: user.displayName || user.username, text });
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('chat message', (data) => {
            const user = JSON.parse(localStorage.getItem('user'));
            const div = document.createElement('div');
            const isMy = user && data.user === (user.displayName || user.username);
            div.className = `message ${isMy ? 'my' : ''}`;
            div.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        // Сохранение профиля на сервер
        document.getElementById('saveProfileBtn').addEventListener('click', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            const username = document.getElementById('usernameInput').value;
            const displayName = document.getElementById('displayNameInput').value;
            const avatarFile = document.getElementById('avatarFileInput').files[0];

            const formData = new FormData();
            formData.append('userId', user.id);
            formData.append('username', username);
            formData.append('displayName', displayName);
            if (avatarFile) {
                formData.append('avatar', avatarFile);
            }

            const res = await fetch('/api/profile', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();

            if (result.success) {
                localStorage.setItem('user', JSON.stringify(result.user));
                initApp(result.user);
                alert('Профиль успешно сохранен на сервере!');
            } else {
                alert('Ошибка: ' + result.error);
            }
        });
    </script>
</body>
</html>
